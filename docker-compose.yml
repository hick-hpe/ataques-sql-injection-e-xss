
services:
  db:
    image: mysql:8.4
    container_name: mysql_lab
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: app_posts
      MYSQL_USER: app_user
      MYSQL_PASSWORD: senha_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-vulneravel:
    build: .
    container_name: app_vulneravel
    command: python src/main.py
    ports:
      - "5000:5000"
    volumes:
      - ./app-vulneravel:/app
    environment:
      MYSQL_HOST: db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: senha_app
      MYSQL_DATABASE: app_posts
      SECRET_KEY: chave-vulneravel
    depends_on:
      db:
        condition: service_healthy

  # app-seguro:
