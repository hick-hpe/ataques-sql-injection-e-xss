<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/posts">
                Publicações
            </a>

            <div class="d-flex align-items-center gap-3">

                <a href="/posts/criar" class="btn btn-primary btn-sm">
                    Nova publicação
                </a>

                <!-- Perfil -->
                <div class="d-flex align-items-center gap-2">

                    <div class="rounded-circle bg-primary text-white
                            d-flex align-items-center justify-content-center fw-semibold"
                        style="width: 36px; height: 36px; font-size: 15px;">
                        {{ session['usuario'][0]|upper }}
                    </div>

                    <span class="small fw-semibold">
                        {{ session['usuario'] }}
                    </span>

                </div>

                <form action="/logout" method="POST">
                    <button class="btn btn-outline-secondary btn-sm">
                        Sair
                    </button>
                </form>

            </div>
        </div>
    </nav>

    <div class="container py-4">

        {% for post in posts %}
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">

                <h5 class="card-title">
                    {{ post.titulo }}
                </h5>

                <p class="card-text">
                    {{ post.conteudo | safe }}
                </p>

                <small class="text-muted">
                    Publicado por {{ post.usuario }}
                    em {{ post.data_criacao }}
                </small>

            </div>
        </div>
        {% else %}
        <p class="text-muted text-center">
            Nenhuma publicação encontrada.
        </p>
        {% endfor %}

    </div>
    
</body>

</html>
